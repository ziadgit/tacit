app = "tacit-vexohacks"          # change it if the name is taken; PUBLIC_BASE_URL follows it
primary_region = "sjc"

[build]

[env]
  TACIT_DATA_DIR = "/data"
  PUBLIC_BASE_URL = "https://tacit-vexohacks.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[mounts]
  source = "tacit_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
