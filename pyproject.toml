[project]
name = "tacit"
version = "0.1.0"
description = "A wristband that listens 24/7 (Vexo Open band + Deepgram + Exa + Jev)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.21",          # Vexo band over Bluetooth
    "pyserial>=3.5",        # Vexo band over USB (fallback)
    "av",                   # decode the band's Opus audio to PCM (kit tests 15.x-19.x)
    "httpx",
    "exa-py",
    "typesafe-sdk>=0.7.5,<0.8",
    "fastapi",
    "uvicorn",
    "typer",
    "pydantic-settings",
    "itsdangerous>=2.2.0",
    "stripe>=17.0.0",
    "pillow>=13.0.0",
    "anthropic>=2.8.0",
]

[project.scripts]
tacit = "tacit.cli:app"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tacit"]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*_test.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
extend-exclude = ["vexo-open-kit"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
